<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <rect width="1200" height="560" fill="#08151F"/>
  <rect x="30" y="30" width="1140" height="500" rx="28" fill="#102230" stroke="#27485F" stroke-width="2"/>
  <text x="60" y="84" fill="#F4FAFF" font-family="Arial, sans-serif" font-size="32" font-weight="700">sesy CLI flow</text>
  <text x="60" y="118" fill="#A5BED0" font-family="Arial, sans-serif" font-size="18">Watch a forwarded port and open a real local Electron window when it becomes live</text>

  <rect x="70" y="180" width="220" height="170" rx="22" fill="#173048" stroke="#3B6D98" stroke-width="2"/>
  <text x="98" y="224" fill="#9FD5FF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Load config</text>
  <text x="98" y="258" fill="#E4F2FF" font-family="Arial, sans-serif" font-size="18">.sesy.json</text>
  <text x="98" y="284" fill="#E4F2FF" font-family="Arial, sans-serif" font-size="18">CLI overrides</text>

  <rect x="350" y="180" width="220" height="170" rx="22" fill="#1E294A" stroke="#5E73B7" stroke-width="2"/>
  <text x="378" y="224" fill="#CCD7FF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Watch port</text>
  <text x="378" y="258" fill="#EEF2FF" font-family="Arial, sans-serif" font-size="18">http://localhost:8000</text>
  <text x="378" y="284" fill="#EEF2FF" font-family="Arial, sans-serif" font-size="18">retry until timeout</text>

  <rect x="630" y="180" width="220" height="170" rx="22" fill="#133126" stroke="#2E8868" stroke-width="2"/>
  <text x="658" y="224" fill="#9DE8C7" font-family="Arial, sans-serif" font-size="24" font-weight="700">Launch Electron</text>
  <text x="658" y="258" fill="#E0F8EE" font-family="Arial, sans-serif" font-size="18">temporary bridge file</text>
  <text x="658" y="284" fill="#E0F8EE" font-family="Arial, sans-serif" font-size="18">secure BrowserWindow</text>

  <rect x="910" y="180" width="220" height="170" rx="22" fill="#332711" stroke="#A47A2F" stroke-width="2"/>
  <text x="938" y="224" fill="#FFD89A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Local app</text>
  <text x="938" y="258" fill="#FFF0D0" font-family="Arial, sans-serif" font-size="18">desktop window opens</text>
  <text x="938" y="284" fill="#FFF0D0" font-family="Arial, sans-serif" font-size="18">Ctrl+C cleans up</text>

  <path d="M290 265 H350" stroke="#7EC2FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 265 H630" stroke="#BBC5FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M850 265 H910" stroke="#8BEAC8" stroke-width="4" stroke-linecap="round"/>
</svg>
